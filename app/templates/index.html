<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grainger Product Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        grainger: {
                            red: '#CC0000',
                            dark: '#0f172a',
                            darker: '#020617',
                            accent: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Inter', sans-serif; }

        .glass {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .product-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .product-card.status-approved {
            border-color: #22c55e !important;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), transparent);
        }

        .product-card.status-rejected {
            border-color: #ef4444 !important;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), transparent);
        }

        .product-card.status-pending {
            border-color: #64748b;
        }

        .btn-action {
            transition: all 0.15s ease;
        }

        .btn-action:hover {
            transform: scale(1.1);
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: skeleton 1.5s infinite;
        }

        @keyframes skeleton {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .file-tab {
            transition: all 0.2s ease;
        }

        .file-tab.active {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-color: #60a5fa;
        }

        .status-badge {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 9999px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .image-container {
            position: relative;
            overflow: hidden;
        }

        .image-container img {
            transition: transform 0.3s ease;
        }

        .product-card:hover .image-container img {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-grainger-darker min-h-screen text-white">
    <!-- Header -->
    <header class="sticky top-0 z-50 glass border-b border-slate-700">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-gradient-to-br from-red-600 to-red-800 rounded-xl flex items-center justify-center shadow-lg">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold">Grainger Products</h1>
                        <p class="text-slate-400 text-sm">Product Selection Portal</p>
                    </div>
                </div>

                <!-- Stats Cards -->
                <div class="flex items-center gap-3">
                    <div class="glass rounded-xl px-4 py-2 text-center min-w-[80px]">
                        <p id="statTotal" class="text-lg font-bold text-blue-400">-</p>
                        <p class="text-[10px] text-slate-400 uppercase">Total</p>
                    </div>
                    <div class="glass rounded-xl px-4 py-2 text-center min-w-[80px] cursor-pointer hover:bg-slate-700/50" onclick="filterByStatus('pending')">
                        <p id="statPending" class="text-lg font-bold text-amber-400">-</p>
                        <p class="text-[10px] text-slate-400 uppercase">Pending</p>
                    </div>
                    <div class="glass rounded-xl px-4 py-2 text-center min-w-[80px] cursor-pointer hover:bg-slate-700/50" onclick="filterByStatus('approved')">
                        <p id="statApproved" class="text-lg font-bold text-green-400">-</p>
                        <p class="text-[10px] text-slate-400 uppercase">Approved</p>
                    </div>
                    <div class="glass rounded-xl px-4 py-2 text-center min-w-[80px] cursor-pointer hover:bg-slate-700/50" onclick="filterByStatus('rejected')">
                        <p id="statRejected" class="text-lg font-bold text-red-400">-</p>
                        <p class="text-[10px] text-slate-400 uppercase">Rejected</p>
                    </div>
                </div>

                <!-- Export Buttons -->
                <div class="flex gap-2">
                    <button onclick="exportExcel('approved')" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg font-medium flex items-center gap-2 transition-all text-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        Export Approved
                    </button>
                    <button onclick="exportExcel(null)" class="bg-slate-600 hover:bg-slate-700 px-4 py-2 rounded-lg font-medium flex items-center gap-2 transition-all text-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        Export All
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- File Selector Tabs -->
        <div id="fileTabsContainer" class="flex gap-3 mb-6 overflow-x-auto pb-2">
            <!-- File tabs will be loaded here -->
        </div>

        <!-- Search & Filters -->
        <div class="glass rounded-2xl p-5 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- Search -->
                <div class="md:col-span-2">
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Search products..."
                            class="w-full bg-slate-800/50 border border-slate-600 rounded-xl px-4 py-3 pl-11 focus:outline-none focus:border-blue-500 transition-colors text-sm">
                        <svg class="w-5 h-5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </div>
                </div>

                <!-- Status Filter -->
                <div>
                    <select id="statusFilter" class="w-full bg-slate-800/50 border border-slate-600 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition-colors text-sm">
                        <option value="">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>

                <!-- Category Filter -->
                <div>
                    <select id="categoryFilter" class="w-full bg-slate-800/50 border border-slate-600 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition-colors text-sm">
                        <option value="">All Categories</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                <!-- Segment Filter -->
                <div>
                    <select id="segmentFilter" class="w-full bg-slate-800/50 border border-slate-600 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition-colors text-sm">
                        <option value="">All Segments</option>
                    </select>
                </div>

                <!-- Manufacturer Filter -->
                <div>
                    <select id="manufacturerFilter" class="w-full bg-slate-800/50 border border-slate-600 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition-colors text-sm">
                        <option value="">All Manufacturers</option>
                    </select>
                </div>

                <!-- Lead Time Filter -->
                <div>
                    <select id="leadTimeFilter" class="w-full bg-slate-800/50 border border-slate-600 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition-colors text-sm">
                        <option value="">All Lead Times</option>
                    </select>
                </div>
            </div>

            <!-- Per Page Selector -->
            <div class="flex flex-wrap items-center gap-3 mt-4 pt-4 border-t border-slate-700">
                <span class="text-sm text-slate-400">Per page:</span>
                <select id="perPageSelect" class="bg-slate-800/50 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 transition-colors">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>

                <div class="w-px h-6 bg-slate-600 mx-1"></div>

                <span class="text-sm text-slate-400">Mark all on this page:</span>
                <button onclick="markAllOnPage('approved')" id="btnApproveAll" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    Approve All (<span class="page-count">0</span>)
                </button>
                <button onclick="markAllOnPage('rejected')" id="btnRejectAll" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                    Reject All (<span class="page-count">0</span>)
                </button>
                <button onclick="markAllOnPage('pending')" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    Reset All
                </button>

                <div class="flex-1"></div>

                <button onclick="loadProducts()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    Refresh
                </button>
            </div>
        </div>

        <!-- Products Grid -->
        <div id="productsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
            <!-- Products will be loaded here -->
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                <div class="glass rounded-2xl p-4"><div class="skeleton h-44 rounded-xl mb-4"></div><div class="skeleton h-4 rounded mb-2"></div><div class="skeleton h-4 rounded w-2/3"></div></div>
                <div class="glass rounded-2xl p-4"><div class="skeleton h-44 rounded-xl mb-4"></div><div class="skeleton h-4 rounded mb-2"></div><div class="skeleton h-4 rounded w-2/3"></div></div>
                <div class="glass rounded-2xl p-4"><div class="skeleton h-44 rounded-xl mb-4"></div><div class="skeleton h-4 rounded mb-2"></div><div class="skeleton h-4 rounded w-2/3"></div></div>
                <div class="glass rounded-2xl p-4"><div class="skeleton h-44 rounded-xl mb-4"></div><div class="skeleton h-4 rounded mb-2"></div><div class="skeleton h-4 rounded w-2/3"></div></div>
            </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <svg class="w-20 h-20 mx-auto text-slate-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
            </svg>
            <h3 class="text-lg font-medium text-slate-400">No products found</h3>
            <p class="text-slate-500 mt-2 text-sm">Try adjusting your filters or select a different file</p>
        </div>

        <!-- Pagination -->
        <div id="paginationContainer" class="flex items-center justify-center gap-2 mt-8">
            <!-- Pagination will be loaded here -->
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div id="productModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="absolute inset-4 md:inset-10 lg:inset-20 glass rounded-3xl overflow-hidden">
            <button onclick="closeModal()" class="absolute top-4 right-4 p-2 hover:bg-white/10 rounded-full transition-colors z-10">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
            <div id="modalContent" class="h-full overflow-y-auto p-6 md:p-10">
                <!-- Modal content will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 z-50 hidden">
        <div class="glass rounded-xl px-5 py-3 flex items-center gap-3 shadow-2xl">
            <div id="toastIcon" class="w-8 h-8 rounded-full flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
            </div>
            <p id="toastMessage" class="font-medium text-sm"></p>
        </div>
    </div>

    <script>
        // State
        let currentPage = 1;
        let perPage = 20;
        let currentSearch = '';
        let currentCategory = '';
        let currentSegment = '';
        let currentStatus = '';
        let currentManufacturer = '';
        let currentLeadTime = '';
        let currentFile = '';
        let currentProducts = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadFiles();

            // Search debounce
            let searchTimeout;
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    currentSearch = e.target.value;
                    currentPage = 1;
                    loadProducts();
                }, 300);
            });

            // Filter listeners
            document.getElementById('statusFilter').addEventListener('change', (e) => {
                currentStatus = e.target.value;
                currentPage = 1;
                loadProducts();
            });

            document.getElementById('categoryFilter').addEventListener('change', (e) => {
                currentCategory = e.target.value;
                currentPage = 1;
                loadProducts();
            });

            document.getElementById('segmentFilter').addEventListener('change', (e) => {
                currentSegment = e.target.value;
                currentPage = 1;
                loadProducts();
            });

            document.getElementById('manufacturerFilter').addEventListener('change', (e) => {
                currentManufacturer = e.target.value;
                currentPage = 1;
                loadProducts();
            });

            document.getElementById('leadTimeFilter').addEventListener('change', (e) => {
                currentLeadTime = e.target.value;
                currentPage = 1;
                loadProducts();
            });

            document.getElementById('perPageSelect').addEventListener('change', (e) => {
                perPage = parseInt(e.target.value);
                currentPage = 1;
                loadProducts();
            });
        });

        // Load source files
        async function loadFiles() {
            try {
                const res = await fetch('/api/files');
                const files = await res.json();

                const container = document.getElementById('fileTabsContainer');

                if (files.length === 0) {
                    container.innerHTML = `
                        <div class="glass rounded-xl px-6 py-4 text-center w-full">
                            <p class="text-slate-400">No data files imported yet. Please run the import script first.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = files.map((f, i) => `
                    <button onclick="selectFile('${f.filename}')"
                        class="file-tab glass rounded-xl px-5 py-3 flex items-center gap-3 border-2 border-transparent hover:border-blue-500/50 transition-all ${i === 0 ? 'active' : ''}"
                        data-file="${f.filename}">
                        <div class="w-10 h-10 rounded-lg bg-gradient-to-br ${i === 0 ? 'from-blue-500 to-blue-700' : 'from-slate-600 to-slate-800'} flex items-center justify-center text-lg font-bold">
                            ${i + 1}
                        </div>
                        <div class="text-right">
                            <p class="font-medium text-sm">${f.display_name}</p>
                            <p class="text-xs text-slate-400">${f.product_count.toLocaleString()} products</p>
                        </div>
                    </button>
                `).join('');

                // Select first file
                if (files.length > 0) {
                    currentFile = files[0].filename;
                    loadStats();
                    loadCategories();
                    loadSegments();
                    loadManufacturers();
                    loadLeadTimes();
                    loadProducts();
                }
            } catch (e) {
                console.error('Error loading files:', e);
            }
        }

        // Select a file
        function selectFile(filename) {
            currentFile = filename;
            currentPage = 1;

            // Update tab styles
            document.querySelectorAll('.file-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.dataset.file === filename) {
                    tab.classList.add('active');
                }
            });

            loadStats();
            loadCategories();
            loadSegments();
            loadManufacturers();
            loadLeadTimes();
            loadProducts();
        }

        // Load stats
        async function loadStats() {
            try {
                const params = currentFile ? `?source_file=${currentFile}` : '';
                const res = await fetch(`/api/stats${params}`);
                const data = await res.json();

                document.getElementById('statTotal').textContent = data.total_products.toLocaleString();
                document.getElementById('statPending').textContent = data.pending.toLocaleString();
                document.getElementById('statApproved').textContent = data.approved.toLocaleString();
                document.getElementById('statRejected').textContent = data.rejected.toLocaleString();
            } catch (e) {
                console.error('Error loading stats:', e);
            }
        }

        // Filter by status
        function filterByStatus(status) {
            document.getElementById('statusFilter').value = status;
            currentStatus = status;
            currentPage = 1;
            loadProducts();
        }

        // Load categories
        async function loadCategories() {
            try {
                const params = currentFile ? `?source_file=${currentFile}` : '';
                const res = await fetch(`/api/categories${params}`);
                const categories = await res.json();

                const select = document.getElementById('categoryFilter');
                select.innerHTML = '<option value="">All Categories</option>';
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.name;
                    option.textContent = `${cat.name} (${cat.count.toLocaleString()})`;
                    select.appendChild(option);
                });
            } catch (e) {
                console.error('Error loading categories:', e);
            }
        }

        // Load segments
        async function loadSegments() {
            try {
                const params = currentFile ? `?source_file=${currentFile}` : '';
                const res = await fetch(`/api/segments${params}`);
                const segments = await res.json();

                const select = document.getElementById('segmentFilter');
                select.innerHTML = '<option value="">All Segments</option>';
                segments.forEach(seg => {
                    const option = document.createElement('option');
                    option.value = seg.name;
                    option.textContent = `${seg.name} (${seg.count.toLocaleString()})`;
                    select.appendChild(option);
                });
            } catch (e) {
                console.error('Error loading segments:', e);
            }
        }

        // Load manufacturers
        async function loadManufacturers() {
            try {
                const params = currentFile ? `?source_file=${currentFile}` : '';
                const res = await fetch(`/api/manufacturers${params}`);
                const manufacturers = await res.json();

                const select = document.getElementById('manufacturerFilter');
                select.innerHTML = '<option value="">All Manufacturers</option>';
                manufacturers.forEach(mfr => {
                    const option = document.createElement('option');
                    option.value = mfr.name;
                    option.textContent = `${mfr.name} (${mfr.count.toLocaleString()})`;
                    select.appendChild(option);
                });
            } catch (e) {
                console.error('Error loading manufacturers:', e);
            }
        }

        // Load lead times
        async function loadLeadTimes() {
            try {
                const params = currentFile ? `?source_file=${currentFile}` : '';
                const res = await fetch(`/api/lead-times${params}`);
                const leadTimes = await res.json();

                const select = document.getElementById('leadTimeFilter');
                select.innerHTML = '<option value="">All Lead Times</option>';
                leadTimes.forEach(lt => {
                    const option = document.createElement('option');
                    option.value = lt.value;
                    option.textContent = `${lt.value} days (${lt.count.toLocaleString()})`;
                    select.appendChild(option);
                });
            } catch (e) {
                console.error('Error loading lead times:', e);
            }
        }

        // Load products
        async function loadProducts() {
            showLoading(true);

            try {
                const params = new URLSearchParams({
                    page: currentPage,
                    per_page: perPage
                });

                if (currentFile) params.append('source_file', currentFile);
                if (currentSearch) params.append('search', currentSearch);
                if (currentCategory) params.append('category', currentCategory);
                if (currentSegment) params.append('segment', currentSegment);
                if (currentStatus) params.append('status', currentStatus);
                if (currentManufacturer) params.append('manufacturer', currentManufacturer);
                if (currentLeadTime) params.append('lead_time', currentLeadTime);

                const res = await fetch(`/api/products?${params}`);
                const data = await res.json();

                currentProducts = data.products;
                renderProducts(data.products);
                renderPagination(data.pagination);
            } catch (e) {
                console.error('Error loading products:', e);
                showToast('Error loading products', 'error');
            }

            showLoading(false);
        }

        // Render products
        function renderProducts(products) {
            const container = document.getElementById('productsContainer');

        // Get proper image URL
        function getImageUrl(imageRef) {
            if (!imageRef || imageRef === 'nan' || imageRef === '') {
                return 'https://via.placeholder.com/200x200/1e293b/64748b?text=No+Image';
            }
            if (imageRef.startsWith('http')) {
                return imageRef;
            }
            return `https://static.grainger.com/rp/s/is/image/Grainger/${imageRef}?$s7product$`;
        }

        // Update product status
        async function updateStatus(productId, newStatus) {
            try {
                await fetch(`/api/products/${productId}/status/${newStatus}`, { method: 'POST' });

                // Update card UI
                const card = document.querySelector(`[data-id="${productId}"]`);
                if (card) {
                    card.classList.remove('status-pending', 'status-approved', 'status-rejected');
                    card.classList.add(`status-${newStatus}`);

                    // Update badge
                    const badge = card.querySelector('.status-badge');
                    const statusColors = {
                        pending: { bg: 'bg-amber-500/20', text: 'text-amber-400', label: 'Pending' },
                        approved: { bg: 'bg-green-500/20', text: 'text-green-400', label: 'Approved' },
                        rejected: { bg: 'bg-red-500/20', text: 'text-red-400', label: 'Rejected' }
                    };
                    const sc = statusColors[newStatus];
                    badge.className = `status-badge ${sc.bg} ${sc.text}`;
                    badge.textContent = sc.label;

                    // Update buttons
                    const buttons = card.querySelectorAll('.btn-action');
                    buttons[0].className = `btn-action flex-1 py-2.5 rounded-xl font-medium flex items-center justify-center gap-1.5 transition-all text-sm ${newStatus === 'approved' ? 'bg-green-600 text-white' : 'bg-green-600/20 text-green-400 hover:bg-green-600 hover:text-white'}`;
                    buttons[1].className = `btn-action flex-1 py-2.5 rounded-xl font-medium flex items-center justify-center gap-1.5 transition-all text-sm ${newStatus === 'rejected' ? 'bg-red-600 text-white' : 'bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white'}`;
                }

                // Update local product data
                const product = currentProducts.find(p => p.id === productId);
                if (product) product.status = newStatus;

                loadStats();
                showToast(`Product ${newStatus}`, newStatus === 'approved' ? 'success' : 'error');
            } catch (e) {
                console.error('Error updating status:', e);
                showToast('Error updating status', 'error');
            }
        }

        // Mark all on page
        async function markAllOnPage(status) {
            if (currentProducts.length === 0) return;

            const productIds = currentProducts.map(p => p.id);

            try {
                await fetch('/api/products/bulk-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_ids: productIds, status: status })
                });

                showToast(`${productIds.length} products marked as ${status}`, status === 'approved' ? 'success' : status === 'rejected' ? 'error' : 'info');
                loadProducts();
                loadStats();
            } catch (e) {
                console.error('Error bulk updating:', e);
                showToast('Error updating products', 'error');
            }
        }

        // Render pagination
        function renderPagination(pagination) {
            const container = document.getElementById('paginationContainer');

            if (pagination.total_pages <= 1) {
                container.innerHTML = pagination.total > 0
                    ? `<span class="text-slate-400 text-sm">${pagination.total.toLocaleString()} items</span>`
                    : '';
                return;
            }

            let html = '<div class="flex flex-col items-center gap-3 w-full">';

            // Page info top
            const fromItem = (pagination.page - 1) * pagination.per_page + 1;
            const toItem = Math.min(pagination.page * pagination.per_page, pagination.total);
            html += `<span class="text-slate-400 text-sm">
                Showing ${fromItem.toLocaleString()}-${toItem.toLocaleString()} of ${pagination.total.toLocaleString()} items
                &nbsp;|&nbsp; Page ${pagination.page} of ${pagination.total_pages}
            </span>`;

            // Navigation buttons
            html += '<div class="flex items-center gap-1 flex-wrap justify-center">';

            // First page
            if (pagination.page > 2) {
                html += `<button onclick="goToPage(1)" class="px-3 py-2 glass rounded-lg hover:bg-white/10 text-sm" title="First page">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
                    </svg>
                </button>`;
            }

            // Previous button
            html += `<button onclick="goToPage(${pagination.page - 1})" ${pagination.page === 1 ? 'disabled' : ''}
                class="px-3 py-2 glass rounded-lg ${pagination.page === 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-white/10'}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>`;

            // Page numbers - show fewer on mobile
            const range = window.innerWidth < 640 ? 1 : 2;
            const start = Math.max(1, pagination.page - range);
            const end = Math.min(pagination.total_pages, pagination.page + range);

            if (start > 1) {
                html += `<button onclick="goToPage(1)" class="px-3 py-2 glass rounded-lg hover:bg-white/10 text-sm">1</button>`;
                if (start > 2) html += `<span class="px-1 text-slate-500">...</span>`;
            }

            for (let i = start; i <= end; i++) {
                const isActive = i === pagination.page;
                html += `<button onclick="goToPage(${i})"
                    class="px-3 py-2 rounded-lg text-sm font-medium ${isActive ? 'bg-blue-600 shadow-lg shadow-blue-600/30' : 'glass hover:bg-white/10'}">${i}</button>`;
            }

            if (end < pagination.total_pages) {
                if (end < pagination.total_pages - 1) html += `<span class="px-1 text-slate-500">...</span>`;
                html += `<button onclick="goToPage(${pagination.total_pages})" class="px-3 py-2 glass rounded-lg hover:bg-white/10 text-sm">${pagination.total_pages}</button>`;
            }

            // Next button
            html += `<button onclick="goToPage(${pagination.page + 1})" ${pagination.page === pagination.total_pages ? 'disabled' : ''}
                class="px-3 py-2 glass rounded-lg ${pagination.page === pagination.total_pages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-white/10'}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </button>`;

            // Last page
            if (pagination.page < pagination.total_pages - 1) {
                html += `<button onclick="goToPage(${pagination.total_pages})" class="px-3 py-2 glass rounded-lg hover:bg-white/10 text-sm" title="Last page">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
                    </svg>
                </button>`;
            }

            html += '</div></div>';

            container.innerHTML = html;
        }

                                    <p class="font-medium text-sm">${product.california_prop_65_wht || 'N/A'}</p>
                                </div>
                                <div>
                                    <p class="text-slate-400 text-xs">Catalog Page</p>
                                    <p class="font-medium text-sm">${product.current_catalog_page_no || 'N/A'}</p>
                                </div>
                            </div>
                            ${product.prop65_cancer_chem ? `
                            <div class="mt-3">
                                <p class="text-slate-400 text-xs">Prop 65 Cancer Chem</p>
                                <p class="font-medium text-sm text-amber-400">${product.prop65_cancer_chem}</p>
                            </div>` : ''}
                            ${product.prop65_repro_chem ? `
                            <div class="mt-2">
                                <p class="text-slate-400 text-xs">Prop 65 Repro Chem</p>
                                <p class="font-medium text-sm text-amber-400">${product.prop65_repro_chem}</p>
                            </div>` : ''}
                            ${product.prop65_warn_scenario ? `
                            <div class="mt-2">
                                <p class="text-slate-400 text-xs">Prop 65 Warning Scenario</p>
                                <p class="font-medium text-sm">${product.prop65_warn_scenario}</p>
                            </div>` : ''}
                            ${product.not4sale_state_list ? `
                            <div class="mt-2">
                                <p class="text-slate-400 text-xs">Not For Sale In States</p>
                                <p class="font-medium text-sm text-red-400">${product.not4sale_state_list}</p>
                            </div>` : ''}
                        </div>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
        }

        // Close modal
        function closeModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        // Show loading
        function showLoading(show) {
            document.getElementById('loadingState').classList.toggle('hidden', !show);
            document.getElementById('productsContainer').classList.toggle('hidden', show);
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = message;

            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-blue-500'
            };

            toastIcon.className = `w-8 h-8 rounded-full flex items-center justify-center ${colors[type] || colors.info}`;
            toast.classList.remove('hidden');

            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (e.key === '/' && !e.ctrlKey) {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
        });
    </script>
</body>
</html>
